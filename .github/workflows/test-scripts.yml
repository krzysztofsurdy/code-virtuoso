name: Test Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check jq (preinstalled on ubuntu-latest)
        run: jq --version

      - name: Run Python script tests
        run: python3 -m unittest discover scripts/tests

      - name: Run loop-virtuoso tests
        run: bash plugins/loop-virtuoso/tests/run.sh

      - name: Run hooks-and-guardrails hook tests
        run: bash skills/playbooks/hooks-and-guardrails/scripts/test-hooks.sh
