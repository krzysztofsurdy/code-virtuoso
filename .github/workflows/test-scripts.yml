name: Test Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use the system bash 3.2 on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"

      - name: Check bash and jq
        run: |
          bash --version | head -n 1
          command -v jq || brew install jq
          jq --version

      - name: Run Python script tests
        run: python3 -m unittest discover scripts/tests

      - name: Run loop-virtuoso tests
        run: bash plugins/loop-virtuoso/tests/run.sh

      - name: Run hooks-and-guardrails hook tests
        run: bash skills/playbooks/hooks-and-guardrails/scripts/test-hooks.sh
