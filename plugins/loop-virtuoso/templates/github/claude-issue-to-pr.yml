# Turns an issue into a draft pull request with Claude Code.
#
# Trigger: add the `claude` label to an issue, or write @claude in a new issue or
# in a comment on an issue. Mentions count only from OWNER, MEMBER or COLLABORATOR;
# labels can only be set by people with triage access, and the action itself
# checks that the actor has write access. Bots are rejected.
#
# Written by /loop-virtuoso:scaffold issue-to-pr. Needs the ANTHROPIC_API_KEY secret
# (or CLAUDE_CODE_OAUTH_TOKEN, see the step) and the Claude GitHub App on the
# repository (https://github.com/apps/claude).
#
# Claude works on a new claude/issue-<n> branch; the last step opens a DRAFT pull
# request from it. Protect the default branch (require pull requests) as well: the
# action lets Claude push to a branch by name, and branch protection is what makes
# "never the default branch" hold for every token.
#
# Adjust: the toolchain setup step, --allowedTools (your test and lint commands),
# --max-turns, --max-budget-usd and timeout-minutes.
name: Claude issue to PR

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

# One run per issue at a time; a second trigger waits instead of racing the first.
concurrency:
  group: claude-issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  implement:
    # Issues only (comments on pull requests are skipped), no bots, and a trigger
    # from someone with write access.
    if: >-
      github.event.sender.type != 'Bot' &&
      !github.event.issue.pull_request &&
      !endsWith(github.actor, '[bot]') &&
      (
        (github.event_name == 'issues' && github.event.action == 'labeled' &&
          github.event.label.name == 'claude') ||
        (github.event_name == 'issues' && github.event.action == 'opened' &&
          contains(github.event.issue.body, '@claude') &&
          !contains(github.event.issue.labels.*.name, 'claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: write # the last step opens the draft pull request
      id-token: write # the action exchanges an OIDC token for its GitHub App token
    steps:
      - uses: actions/checkout@v6

      # Set up your toolchain here so Claude can run the tests, for example
      # shivammathur/setup-php, actions/setup-node or actions/setup-python.

      - name: Implement the issue
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Or, with a Claude subscription instead of an API key:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          trigger_phrase: "@claude"
          branch_prefix: claude/
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}"
          claude_args: |
            --max-turns 40
            --max-budget-usd 5
            --allowedTools "Bash(make test:*),Bash(make lint:*)"
            --append-system-prompt "Implement the issue on the branch you are on, run the tests and the linter, then commit and push that branch. Never push to any other branch. Do not edit .github/."

      - name: Open a draft pull request
        if: steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          case "$BRANCH" in
            claude/*) ;;
            *) echo "::error::Refusing to open a pull request from $BRANCH: not a claude/ branch."; exit 1 ;;
          esac
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
            echo "Claude pushed nothing to $BRANCH; no pull request opened."
            exit 0
          fi
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request from $BRANCH is already open."
            exit 0
          fi
          # A pull request opened with GITHUB_TOKEN does not start other workflows.
          # Push a commit or close and reopen it to run CI.
          gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" \
            --body "Closes #$ISSUE. Opened as a draft from Claude's work on the issue; review it before marking it ready."
